{#- Tek çizgi kalınlığında, 24'lük ızgarada çizilmiş SVG ikonlar. Süs: ekran okuyucudan gizli. -#}
{%- macro icon(name) -%}
<svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{%- if name == "moon" -%}<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/>
{%- elif name == "sun" -%}<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/>
{%- elif name == "copy" -%}<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/>
{%- elif name == "share" -%}<path d="M12 3v12M7.5 7.5 12 3l4.5 4.5"/><path d="M5 12v6.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V12"/>
{%- elif name == "download" -%}<path d="M12 4v11M7.5 10.5 12 15l4.5-4.5"/><path d="M5 19.5h14"/>
{%- elif name == "back" -%}<path d="M15 5 8 12l7 7"/>
{%- elif name == "next" -%}<path d="M9 5l7 7-7 7"/>
{%- elif name == "redo" -%}<path d="M4 12a8 8 0 1 0 2.3-5.6L4 8.7"/><path d="M4 4v4.7h4.7"/>
{%- elif name == "trash" -%}<path d="M4.5 7h15M10 11v6M14 11v6M6.5 7l.8 11.2A2 2 0 0 0 9.3 20h5.4a2 2 0 0 0 2-1.8L17.5 7M9.5 7V4.5h5V7"/>
{%- elif name == "check" -%}<path d="m5 12.5 4.5 4.5L19 7.5"/>
{%- elif name == "alert" -%}<circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5v.01"/>
{%- endif -%}
</svg>
{%- endmacro -%}
